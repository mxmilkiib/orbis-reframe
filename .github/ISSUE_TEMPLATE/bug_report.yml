name: Bug report
description: Something doesn't work, crashes, or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The diagnostics below answer most of the
        first questions, so please don't skip them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Added VID_..._00_012.insv to the timeline
        2. Turned on Horizon lock and pressed Space
        3. The picture froze after a few seconds; the timeline kept moving.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Help ▸ About orbis-reframe ▸ **Copy diagnostics**, and paste here.
        If the window doesn't open, paste the output of
        `orbis-reframe --version` and `vulkaninfo --summary` instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: clip
    attributes:
      label: Clip and camera
      description: |
        Resolution and frame rate (e.g. 8K 30 fps), the camera's firmware
        version, how the camera was mounted, and whether the problem happens
        on every clip or one. Don't attach clips with people's faces or
        number plates you don't want public.
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Terminal output
      description: |
        Start orbis-reframe from a terminal with `ORBIS_VERBOSE=1 orbis-reframe`,
        reproduce the problem, and paste what it printed.
      render: text
    validations:
      required: false
